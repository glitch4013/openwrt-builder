name: Build Micro LEDE 17.01 4MB

on:
  workflow_dispatch:

jobs:
  build:
    # استخدام 22.04 أفضل هنا لأن بيئة 17.01 قديمة (عام 2017) وتتوافق بشكل أفضل مع مكتباته
    runs-on: ubuntu-22.04 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git unzip libssl-dev wget python3 python2 zlib1g-dev file

      - name: Download Image Builder 17.01.0
        run: |
          wget https://archive.openwrt.org/releases/17.01.0/targets/ar71xx/generic/lede-imagebuilder-17.01.0-ar71xx-generic.Linux-x86_64.tar.xz
          tar -xf lede-imagebuilder-17.01.0-ar71xx-generic.Linux-x86_64.tar.xz
          cd lede-imagebuilder-17.01.0-ar71xx-generic.Linux-x86_64
          echo "BUILD_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Build Micro Image with QoS
        run: |
          cd ${{ env.BUILD_DIR }}
          make image \
            PROFILE="tl-wr740n-v6" \
            PACKAGES="wpad-mini tc kmod-sched-core ip-full -luci -uhttpd -luci-app-firewall -luci-theme-bootstrap -odhcp6c -odhcpd-ipv6only -kmod-ipv6 -ip6tables -ppp -ppp-mod-pppoe -kmod-pppoe -kmod-ppp"

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lede-17.01-740n-v6-wisp-qos
          path: ${{ env.BUILD_DIR }}/bin/targets/ar71xx/generic/*.bin
