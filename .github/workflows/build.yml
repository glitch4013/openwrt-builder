name: Build Home WISP OpenWrt 17.01

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ libncurses5-dev gawk git unzip libssl-dev wget python2 zlib1g-dev file
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Download Image Builder 17.01.0
        run: |
          wget https://archive.openwrt.org/releases/17.01.0/targets/ar71xx/generic/lede-imagebuilder-17.01.0-ar71xx-generic.Linux-x86_64.tar.xz
          tar -xf lede-imagebuilder-17.01.0-ar71xx-generic.Linux-x86_64.tar.xz
          cd lede-imagebuilder-17.01.0-ar71xx-generic.Linux-x86_64
          echo "BUILD_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Build Home WISP Image
        run: |
          cd ${{ env.BUILD_DIR }}
          make image \
            PROFILE="tl-wr740n-v6" \
            PACKAGES="wpad-mini dnsmasq iptables tc kmod-sched-core ip-full -odhcp6c -odhcpd-ipv6only -kmod-ipv6 -ip6tables -ppp -ppp-mod-pppoe -kmod-pppoe -kmod-ppp -luci -uhttpd -luci-app-firewall -luci-theme-bootstrap"

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lede-17.01-home-wisp
          path: ${{ env.BUILD_DIR }}/bin/targets/ar71xx/generic/*.bin
