name: Build Ultra-Tiny OpenWrt 18.06.9 (4MB)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ libncurses5-dev gawk git unzip libssl-dev wget python2 zlib1g-dev file
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Download Image Builder 18.06.9 Tiny
        run: |
          wget https://archive.openwrt.org/releases/18.06.9/targets/ar71xx/tiny/openwrt-imagebuilder-18.06.9-ar71xx-tiny.Linux-x86_64.tar.xz
          tar -xf openwrt-imagebuilder-18.06.9-ar71xx-tiny.Linux-x86_64.tar.xz
          cd openwrt-imagebuilder-18.06.9-ar71xx-tiny.Linux-x86_64
          echo "BUILD_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Copy custom files to Image Builder
        run: |
          if [ -d "files" ]; then
            # نسخ مجلد files بالكامل ليكون داخل بيئة Image Builder
            cp -r files ${{ env.BUILD_DIR }}/
            echo "Custom files copied successfully!"
            ls -la ${{ env.BUILD_DIR }}/files/etc/uci-defaults/
          else
            echo "Warning: files directory not found!"
          fi

      - name: Build Ultra Tiny Image
        run: |
          cd ${{ env.BUILD_DIR }}
          
          # تجاوز الفحص الإجباري
          mkdir -p staging_dir/host
          touch staging_dir/host/.prereq-build
          
          make image \
            PROFILE="tl-wr740n-v6" \
            FILES="files" \
            PACKAGES="wpad-mini tc kmod-sched-core ddns-scripts \
            -opkg -uhttpd -uhttpd-mod-ubus \
            -odhcp6c -odhcpd-ipv6only -kmod-ipv6 -ip6tables \
            -ppp -ppp-mod-pppoe -kmod-pppoe -kmod-ppp \
            -odhcpd -logd -kmod-usb-core -kmod-usb2 \
            -libiwinfo-lua -liblua -libubus-lua -libuci-lua -lua \
            -luci -luci-app-firewall -luci-base -luci-lib-ip \
            -luci-lib-nixio -luci-mod-admin-full -luci-proto-ipv6 \
            -luci-proto-ppp -luci-theme-bootstrap"

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-18.06-ultra-tiny-740n-v6
          path: ${{ env.BUILD_DIR }}/bin/targets/ar71xx/tiny/*squashfs*.bin
