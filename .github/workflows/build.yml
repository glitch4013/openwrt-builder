name: Build Micro OpenWrt 4MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 python3-setuptools file

      - name: Download Image Builder
        run: |
          wget https://archive.openwrt.org/releases/19.07.10/targets/ar71xx/generic/openwrt-imagebuilder-19.07.10-ar71xx-generic.Linux-x86_64.tar.xz
          tar -xf openwrt-imagebuilder-19.07.10-ar71xx-generic.Linux-x86_64.tar.xz
          cd openwrt-imagebuilder-19.07.10-ar71xx-generic.Linux-x86_64
          echo "BUILD_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Build Micro Image
        run: |
          cd ${{ env.BUILD_DIR }}
          make image \
            PROFILE="tl-wr740n-v6" \
            PACKAGES="wpad-basic -luci -uhttpd -luci-app-firewall -luci-theme-bootstrap -odhcpd-ipv6only -kmod-ipv6 -ip6tables -ppp -ppp-mod-pppoe -kmod-pppoe -kmod-ppp"

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-740n-v6-micro
          path: ${{ env.BUILD_DIR }}/bin/targets/ar71xx/generic/*.bin
